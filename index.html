async function soulSilverEncounters(id){let data=[];try{data=await apiJson(`https://pokeapi.co/api/v2/pokemon/${id}/encounters`)}catch{return[]}const rows=[];for(const loc of data){const vd=loc.version_details.find(v=>v.version.name==='soulsilver');if(!vd)continue;const grouped=new Map();for(const d of vd.encounter_details){const method=methodLabels[d.method.name]||prettyApiName(d.method.name);const conditions=d.condition_values.map(x=>conditionLabels[x.name]||'Condizione speciale').join(' · ');const key=method+'|'+conditions;if(!grouped.has(key))grouped.set(key,{method,conditions,min:d.min_level,max:d.max_level,chance:0});const g=grouped.get(key);g.min=Math.min(g.min,d.min_level);g.max=Math.max(g.max,d.max_level);g.chance=Math.min(100,g.chance+d.chance)}for(const g of grouped.values())rows.push({place:placeNameFromArea(loc.location_area.name),...g})}return rows.sort((a,b)=>a.place.localeCompare(b.place,'it')).slice(0,40)}
async function renderPokemonDetail(speciesName){app.innerHTML=`<button class="link-button secondary pokemon-back" id="backDex">← Elenco Pokémon</button><div class="panel loading-block"><div><div class="spinner"></div><p class="muted">Caricamento scheda…</p></div></div>`;backDex.onclick=()=>navigate({view:'pokedex'});try{const species=await apiJson(`https://pokeapi.co/api/v2/pokemon-species/${speciesName}`),pokemon=await apiJson(`https://pokeapi.co/api/v2/pokemon/${species.id}`),chain=await apiJson(species.evolution_chain.url);const names=chainSpecies(chain.chain),edges=evolutionEdges(chain.chain);const familyData=await Promise.all(names.map(n=>apiJson(`https://pokeapi.co/api/v2/pokemon/${n}`).catch(()=>null)));const moveSets=await Promise.all(familyData.filter(Boolean).map(async p=>({name:p.name,rows:await levelMoves(p)})));const encounters=await soulSilverEncounters(pokemon.id);const stats=Object.fromEntries(pokemon.stats.map(x=>[x.stat.name,x.base_stat])),nature=recommendedNatureFromStats(stats),itName=italianName(species,pokemonName(species.name));const obtain=[];if(SPECIAL_OBTAIN[pokemon.id])obtain.push(SPECIAL_OBTAIN[pokemon.id]);for(const e of encounters)obtain.push(`<b>${escapeHtml(e.place)}</b> — ${escapeHtml(e.method)}, Lv ${e.min===e.max?e.min:`${e.min}–${e.max}`}, ${e.chance}%${e.conditions?' · '+escapeHtml(e.conditions):''}`);if(!obtain.length){const incoming=edges.find(x=>x.to===species.name);if(incoming)obtain.push(`Si ottiene evolvendo ${pokemonName(incoming.from)}: ${evolutionDetailText(incoming.details[0])}.`);else obtain.push('Non risulta catturabile direttamente in SoulSilver: può richiedere scambio, evento, trasferimento o un metodo speciale.')}
app.innerHTML=`<button class="link-button secondary pokemon-back" id="backDex">← Elenco Pokémon</button><section class="panel"><div class="pokemon-hero"><img class="pokemon-art" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemon.id}.png" alt="${escapeHtml(itName)}"><div><span class="tag">#${String(pokemon.id).padStart(3,'0')}</span><h1 style="margin:8px 0 0">${escapeHtml(itName)}</h1><div class="pokemon-types">${pokemon.types.map(x=>`<span>${typeIt[x.type.name]||prettyApiName(x.type.name)}</span>`).join('')}</div><p><b>Natura consigliata:</b> ${nature[0]}</p><p class="muted">${nature[1]}. Consiglio indicativo basato sulle statistiche base; il set di mosse può cambiare la scelta.</p><div class="stat-grid">${pokemon.stats.map(x=>`<div class="stat"><span class="muted">${statIt[x.stat.name]||x.stat.name}</span><b>${x.base_stat}</b></div>`).join('')}</div></div></div></section><div class="sections"><section class="panel"><h2>Evoluzione</h2><div class="evolution-list">${edges.length?edges.map(e=>`<div class="evolution-step"><b>${pokemonName(e.from)} → ${pokemonName(e.to)}</b><div class="muted">${escapeHtml(evolutionDetailText(e.details[0]))}</div></div>`).join(''):'<p class="empty">Questo Pokémon non si evolve.</p>'}</div></section><section class="panel"><h2>Dove si trova / come si ottiene</h2><div class="obtain-list">${obtain.map(x=>`<div class="obtain-row">${x}</div>`).join('')}</div><p class="small-note">Gli incontri selvatici sono filtrati sulla versione SoulSilver. Regali, incontri fissi e casi speciali sono integrati separatamente quando disponibili.</p></section><section class="panel"><h2>Mosse apprese salendo di livello</h2><p class="muted">Ogni stadio evolutivo ha la propria tabella: così puoi confrontare le mosse imparate prima e dopo l’evoluzione.</p><div class="move-family">${moveSets.map(ms=>`<div class="move-stage"><h3>${pokemonName(ms.name)}</h3>${ms.rows.length?`<div class="table-scroll"><table class="move-table"><thead><tr><th>Livello</th><th>Mossa</th></tr></thead><tbody>${ms.rows.map(r=>`<tr><td>${r.level===0?'Evoluzione / Lv 1':r.level}</td><td><b>${escapeHtml(r.label)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty" style="padding:12px">Nessuna mossa per livello registrata in HGSS.</p>'}</div>`).join('')}</div></section></div>`;document.getElementById('backDex').onclick=()=>navigate({view:'pokedex'})}catch(err){app.innerHTML=`<button class="link-button secondary pokemon-back" onclick="navigate({view:'pokedex'})">← Elenco Pokémon</button><div class="error-box">Impossibile caricare la scheda di questo Pokémon. Controlla la connessione e riprova.</div>`}}
buildNav();routeState=history.state||parseLocation();history.replaceState(routeState,'',stateUrl(routeState));renderState();
