Come pubblicarlo sul sito

Ci sono quasi 500 file tra mappe e anteprime. Per evitare di caricarli manualmente, ho preparato un sistema che pubblica tutto partendo da un solo ZIP tramite GitHub Actions.

Scarica questi due file:

Scarica il pacchetto da pubblicare
deploy-pages.yml
Passaggio 1 — Carica lo ZIP nel repository

Nel repository:

francescobovo1993-tech/pokemon-soulsilver-companion
Vai nella pagina principale del repository.
Clicca Add file → Upload files.
Carica:
pokemon-ss-v6-site.zip
Scrivi come messaggio:
Add SoulSilver v6 maps
Clicca Commit changes.

Il file pesa circa 21 MB, quindi rientra nel limite GitHub di 25 MiB per un file caricato dal browser.

Passaggio 2 — Crea il workflow
Clicca Add file → Create new file.
Nel campo del nome scrivi esattamente:
.github/workflows/deploy.yml
Sul Mac apri il file che hai scaricato:
deploy-pages.yml
Copia tutto il suo contenuto.
Incollalo nella pagina GitHub.
Clicca Commit changes.

Il workflow estrae automaticamente pokemon-ss-v6-site.zip e pubblica il contenuto come sito GitHub Pages usando le azioni ufficiali configure-pages, upload-pages-artifact e deploy-pages.

Passaggio 3 — Imposta GitHub Pages su Actions

Nel repository:

Apri Settings.
Nel menu laterale clicca Pages.
Sotto Build and deployment, trova Source.
Seleziona:
GitHub Actions

GitHub richiede questa impostazione quando il sito viene pubblicato tramite un workflow personalizzato.

Passaggio 4 — Controlla la pubblicazione
Apri la scheda Actions del repository.
Cerca:
Pubblica SoulSilver Companion
Attendi che compaia il segno verde.
Apri il sito:
https://francescobovo1993-tech.github.io/pokemon-soulsilver-companion/
Aggiorna forzatamente:
Cmd + Shift + R

Il link del sito resta lo stesso e il login Supabase continua a usare lo stesso database.

