name: Pubblica SoulSilver Companion v8 verificato

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Estrai il sito v8
        run: |
          rm -rf _site
          mkdir _site
          unzip -q pokemon-ss-v8-site.zip -d _site

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa il lettore Pokémon Central
        run: python -m pip install -r _site/tools/requirements.txt

      - name: Acquisisci strumenti, posizioni e collegamenti
        run: python _site/tools/scrape_wiki_data.py --site _site --strict --delay 0.25 --retries 2

      - name: Verifica che la build sia completa
        run: python _site/tools/validate_build.py _site

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file per Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
